org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# These are known-good values for Minecraft 1.21 (not 1.21.1+) at the time this
# project was written. Fabric publishes new mapping/loader/API builds constantly,
# so before you build, double check the newest numbers for MC 1.21 at:
# https://fabricmc.net/develop
minecraft_version=1.21
yarn_mappings=1.21+build.9
loader_version=0.16.9

# Mod Properties
mod_version=1.0.0
maven_group=com.pingtweaks
archives_base_name=pingtweaks

# Dependencies
fabric_version=0.100.8+1.21
